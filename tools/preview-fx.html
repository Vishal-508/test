<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx.js preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; color: #cfd6e4; font: 12px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 10px; top: 8px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #hud button { pointer-events: auto; background: #151b2a; color: #cfd6e4; border: 1px solid #2c3650; border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; }
  #hud button.on { background: #2a3a66; border-color: #5a78c8; }
  #info { margin-left: auto; opacity: 0.8; font-variant-numeric: tabular-nums; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="views"></span>
  <button id="rainBtn">rain</button><button id="qBtn">quality</button><button id="postBtn">post</button>
  <button id="boltBtn">lightning</button><button id="sparkBtn">sparks</button><button id="pauseBtn">pause</button>
  <span id="info"></span>
</div>
<script type="module">
// Preview for js/fx.js, lit and tone-mapped the way js/game.js does it (same hemisphere and moon lights, fog, exposure).
//   - a "car" drifts round a circle: tyre smoke every 100 ms from the rear axle, a skid mark under each rear wheel,
//     a backfire flame now and then
//   - a second one circles on a dirt patch and throws dust instead
//   - a spark burst every second against the post on the right (strength cycles 0.3, 0.65, 1)
//   - rain at level 0.8, and lightning every 3 seconds whose fx.flash brightens the hemisphere and moon lights
// Drag to orbit, wheel to zoom.
// URL options: ?view=chase|close|sparks|top|low  &rain=0.8  &q=high|low  &post=1  &auto=0 (no emitters)  &bolt=0 (no lightning)
//              &fog=none|exp2 (other fog set-ups)  &gl=1 (force a WebGL 1 context, as on old phones)
// For scripted checks: window.__P = { fx, freeze(on), step(n, dt), draw(), fxDrawCalls(), setView(name), burst(strength), ... }
import * as THREE from '../vendor/three.module.min.js';
import { Fx } from '../js/fx.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = Q.get('gl') === '1' && THREE.WebGL1Renderer ? new THREE.WebGL1Renderer({ canvas, antialias: true }) : new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
renderer.info.autoReset = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f1d);
scene.fog = Q.get('fog') === 'none' ? null : Q.get('fog') === 'exp2' ? new THREE.FogExp2(0x0a0f1d, 0.03) : new THREE.Fog(0x0a0f1d, 16, 52);
const camera = new THREE.PerspectiveCamera(52, 1, 1.6, 180);
const HEMI = 1.55, MOON = 1.05;
const hemi = new THREE.HemisphereLight(0x8d93ab, 0x4c4850, HEMI); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xc6ceff, MOON); moon.position.set(-30, 40, 45); scene.add(moon);

// dark tarmac with grain, a dirt patch on the left for the dust car
const gc = document.createElement('canvas'); gc.width = gc.height = 512;
const g2 = gc.getContext('2d'); g2.fillStyle = '#262b36'; g2.fillRect(0, 0, 512, 512);
for (let k = 0; k < 9000; k++) { const v = 26 + Math.random() * 30 | 0; g2.fillStyle = `rgba(${v},${v + 3},${v + 10},0.5)`; g2.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
const gt = new THREE.CanvasTexture(gc); gt.colorSpace = THREE.SRGBColorSpace; gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(24, 24); gt.anisotropy = 4;
const gmat = new THREE.MeshStandardMaterial({ map: gt, roughness: 0.9, metalness: 0 }); gmat.color.setRGB(1.62, 1.55, 1.48);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), gmat); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const dirt = new THREE.Mesh(new THREE.CircleGeometry(2.6, 40), new THREE.MeshStandardMaterial({ color: 0x4a3c2c, roughness: 1 }));
dirt.rotation.x = -Math.PI / 2; dirt.position.set(-5.4, 0.004, 0.6); scene.add(dirt);

// stand-in cars (the real ones live in js/cars.js): a dark body, two tail lamps, facing +Z
const bodyGeo = new THREE.BoxGeometry(0.36, 0.2, 0.86), lampGeo = new THREE.BoxGeometry(0.07, 0.04, 0.02);
const lampMat = new THREE.MeshBasicMaterial({ color: 0xff2a1a });
function standIn(color) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.5 })); b.position.y = 0.16; g.add(b);
  for (const sx of [-1, 1]) { const l = new THREE.Mesh(lampGeo, lampMat); l.position.set(sx * 0.12, 0.2, -0.44); g.add(l); }
  scene.add(g);
  return g;
}
// the post the sparks fly off
const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, 1.6), new THREE.MeshStandardMaterial({ color: 0x3a3f4c, roughness: 0.8 }));
post.position.set(4.6, 0.55, 0.4); scene.add(post);

const fx = new Fx(scene, { quality: Q.get('q') === 'low' ? 'low' : 'high' });
let rainLevel = Q.has('rain') ? +Q.get('rain') : 0.8;
fx.setRain(rainLevel, true);
const autoEmit = Q.get('auto') !== '0', autoBolt = Q.get('bolt') !== '0';

// two drifting cars: { centre, radius, angular speed, dust? }
const drivers = [
  { car: standIn(0x7a1f24), cx: 0, cz: 0, r: 2.4, w: 1.25, ph: 0, dust: false, lw: null, emit: 0 },
  { car: standIn(0x2c4a6a), cx: -5.4, cz: 0.6, r: 1.5, w: -1.5, ph: 2, dust: true, lw: null, emit: 0 },
];
let simT = 0, sparkT = 0.5, boltT = 1.2, flameT = 0, sparkN = 0;
const focus = { x: 0, z: 0 };
const SPARK_AT = { x: 4.42, y: 0.18, z: 0.4 };
function burst(strength) { fx.sparks(SPARK_AT.x, SPARK_AT.y, SPARK_AT.z + (Math.random() - 0.5) * 0.8, -1, 0.25, strength); }

function sim(dt) {
  simT += dt;
  for (const d of drivers) {
    const a = d.ph + simT * d.w, dir = Math.sign(d.w);
    const x = d.cx + Math.sin(a) * d.r, z = d.cz + Math.cos(a) * d.r;
    const heading = a + dir * (Math.PI / 2 + 0.42);                  // tangent, nose turned into the circle: a drift
    d.car.position.set(x, 0, z); d.car.rotation.y = heading;
    const fxh = Math.sin(heading), fzh = Math.cos(heading), rx = x - fxh * 0.27, rz = z - fzh * 0.27;
    const lx = rx + fzh * 0.15, lz = rz - fxh * 0.15, qx = rx - fzh * 0.15, qz = rz + fxh * 0.15;
    if (autoEmit) {
      if (d.lw) { fx.skid(d.lw[0], d.lw[1], lx, lz, 0.07, d.dust ? 0.35 : 0.6); fx.skid(d.lw[2], d.lw[3], qx, qz, 0.07, d.dust ? 0.35 : 0.6); }
      d.emit -= dt;
      if (d.emit <= 0) { d.emit += 0.1; if (d.dust) fx.dust(rx, 0.08, rz, 0.8); else fx.smoke(rx, 0.1, rz, 0.85); }
      if (!d.dust) { flameT -= dt; if (flameT <= 0) { flameT = 0.4; fx.flame(x - fxh * 0.46, 0.1, z - fzh * 0.46, -fxh, -fzh); } }
    }
    d.lw = d.lw || [0, 0, 0, 0]; d.lw[0] = lx; d.lw[1] = lz; d.lw[2] = qx; d.lw[3] = qz;
  }
  if (autoEmit) { sparkT -= dt; if (sparkT <= 0) { sparkT += 1; burst([0.3, 0.65, 1][sparkN++ % 3]); } }
  if (autoBolt) { boltT -= dt; if (boltT <= 0) { boltT += 3; fx.lightning(); } }
  fx.update(dt, simT, focus);
  hemi.intensity = HEMI + fx.flash * 3.2; moon.intensity = MOON + fx.flash * 2.6;      // exactly what the game does with fx.flash
}

// camera: orbit about a target
const VIEWS = {
  chase: { t: [0.6, 0.3, 0], yaw: 0, pitch: 0.84, dist: 10.5 },
  close: { t: [0, 0.4, 0.4], yaw: 0.5, pitch: 0.42, dist: 6 },
  sparks: { t: [3.7, 0.35, 0.4], yaw: 0.25, pitch: 0.4, dist: 4.4 },
  top: { t: [-1.5, 0, 0.3], yaw: 0, pitch: 1.5, dist: 13 },
  low: { t: [0, 0.8, 0], yaw: -0.6, pitch: 0.12, dist: 7.5 },
};
const cam = { t: new THREE.Vector3(), yaw: 0, pitch: 0.8, dist: 10 };
function setView(name) {
  const v = VIEWS[name] || VIEWS.chase; cam.t.fromArray(v.t); cam.yaw = v.yaw; cam.pitch = v.pitch; cam.dist = v.dist;
  for (const b of document.querySelectorAll('#views button')) b.classList.toggle('on', b.textContent === name);
}
for (const name of Object.keys(VIEWS)) { const b = document.createElement('button'); b.textContent = name; b.onclick = () => setView(name); document.getElementById('views').appendChild(b); }
setView(Q.get('view') || 'chase');
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; cam.yaw -= (e.clientX - drag.x) * 0.006; cam.pitch = Math.min(1.52, Math.max(0.05, cam.pitch + (e.clientY - drag.y) * 0.005)); drag.x = e.clientX; drag.y = e.clientY; });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.min(30, Math.max(2.5, cam.dist + e.deltaY * 0.01)); }, { passive: false });

// the game's own bloom and grade, when asked for and available
let postFx = null, postOn = false;
async function setPost(on) {
  if (on && !postFx) {
    try { const m = await import('../js/postfx.js'); postFx = m.makePost(renderer, scene, camera); resize(); }
    catch (e) { console.warn('post-processing not available in this preview', e); postFx = null; on = false; }
  }
  if (postFx) { postFx.setEnabled(on); postOn = postFx.enabled; } else postOn = false;
  document.getElementById('postBtn').classList.toggle('on', postOn);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (postFx) postFx.setSize(w, h);
}
addEventListener('resize', resize); resize();

function draw() {
  const cp = Math.cos(cam.pitch);
  camera.position.set(cam.t.x + Math.sin(cam.yaw) * cp * cam.dist, cam.t.y + Math.sin(cam.pitch) * cam.dist, cam.t.z + Math.cos(cam.yaw) * cp * cam.dist);
  camera.lookAt(cam.t);
  focus.x = cam.t.x; focus.z = cam.t.z;
  renderer.info.reset();
  if (postOn && postFx) { postFx.uniforms.uFlash.value = fx.flash * 0.16; postFx.render(0.016); } else renderer.render(scene, camera);
}
// draw calls the effects add: every visible layer is exactly one
function fxDrawCalls() {
  const was = postOn; postOn = false;
  draw(); const all = renderer.info.render.calls;
  fx.group.visible = false; draw(); const without = renderer.info.render.calls; fx.group.visible = true;
  postOn = was; draw();
  return all - without;
}

let frozen = false, last = performance.now(), fps = 60, shown = 0;
const info = document.getElementById('info');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (dt > 0) fps += (1 / dt - fps) * 0.08;
  if (!frozen) sim(dt);
  draw();
  if (now - shown > 250) {
    shown = now;
    const layers = fx.group.children.filter(m => m.visible).length;
    info.textContent = `${fps.toFixed(0)} fps   draw calls ${renderer.info.render.calls} (fx layers ${layers})   tris ${renderer.info.render.triangles}   rain ${fx.rain.toFixed(2)}   flash ${fx.flash.toFixed(2)}   ${fx.quality}`;
  }
}

document.getElementById('rainBtn').onclick = () => { const steps = [0, 0.4, 0.8, 1]; rainLevel = steps[(steps.indexOf(rainLevel) + 1) % steps.length] || 0; fx.setRain(rainLevel); document.getElementById('rainBtn').textContent = 'rain ' + rainLevel; };
document.getElementById('rainBtn').textContent = 'rain ' + rainLevel;
document.getElementById('qBtn').onclick = () => { fx.setQuality(fx.quality === 'low' ? 'high' : 'low'); document.getElementById('qBtn').textContent = 'quality ' + fx.quality; };
document.getElementById('qBtn').textContent = 'quality ' + fx.quality;
document.getElementById('postBtn').onclick = () => setPost(!postOn);
document.getElementById('boltBtn').onclick = () => fx.lightning();
document.getElementById('sparkBtn').onclick = () => burst(1);
document.getElementById('pauseBtn').onclick = () => { frozen = !frozen; document.getElementById('pauseBtn').classList.toggle('on', frozen); };

window.__P = {
  fx, THREE, scene, camera, renderer, cam, drivers,
  freeze(on) { frozen = !!on; },
  step(n, dt) { for (let i = 0; i < (n || 1); i++) sim(dt || 1 / 60); },
  draw, fxDrawCalls, setView, setPost, burst,
  get postOn() { return postOn; },
};
if (Q.get('post') === '1') await setPost(true);
window.__ready = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
