<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hideouts preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b16; color: #cfd6ea; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 10px; top: 8px; right: 10px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: #ffd98a; }
  #map { color: #8892ad; font-size: 11px; }
  #bar { position: fixed; left: 10px; bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; background: #1a2238; color: #cfd6ea; border: 1px solid #36405e; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="bar"></div>
<script type="module">
// Preview for js/hideouts.js: all nine kinds side by side, each in a bay between three grey walls with a stand-in car.
// Without options it loops: open, door comes down, police search (rattle and torchlight), door opens again.
// Lighting, tone mapping, fog and the two cameras (chase, hide) copy what js/game.js does at the time of writing.
// URL options: view=all|trio0|trio1|trio2|chase|hide|close|front|side|top|inside  k=<kind index 0..8>
//              f=<0..1> fixes how far the doors are closed   s=<0..1> fixes the search level
//              roof=0 hides the overhead (cutMat) surfaces, as the cut-away circle does in the game
//              wallh=<height of the stand-in walls>  bright=1  car=0  labels=1  seed=<n>  jeep=1  ix=<sideways camera shift, inside view>
//              w=<bay width> d=<bay depth>  head=1 adds the player's headlight (a SpotLight) shining in from the mouth  tone=0 turns ACES off
import * as THREE from '../vendor/three.module.min.js';
import { HIDEOUT_KINDS, kindFor, buildHideout } from '../js/hideouts.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) && Q.get(k) !== '' && !isNaN(+Q.get(k)) ? +Q.get(k) : d);
const W = num('w', 1.5), D = num('d', 2.0), GAP = W + 1.5, WALL_H = num('wallh', 1.2), SEED = num('seed', 3);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
if (num('tone', 1)) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.5; }   // as js/postfx.js sets it
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.Fog(0x070b16, 16, 52);
const camera = new THREE.PerspectiveCamera(52, 1, 0.03, 180);
// the game's night lighting: a dim hemisphere light and a dim moon
const bright = num('bright', 0) ? 2.2 : 1;
scene.add(new THREE.HemisphereLight(0x8d93ab, 0x4c4850, 1.55 * bright));
const moon = new THREE.DirectionalLight(0xc6ceff, 1.05 * bright); moon.position.set(-30, 40, 45); scene.add(moon);
const headlamp = new THREE.SpotLight(0xfff1d0, num('head', 0) ? 16 : 0, 13, 0.56, 0.85, 1.0); scene.add(headlamp); scene.add(headlamp.target);

const lam = c => new THREE.MeshLambertMaterial({ color: c });
const bas = c => new THREE.MeshBasicMaterial({ color: c });
const box = (w, h, d, mat, x, y, z, parent) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); (parent || scene).add(m); return m; };

// dark floor, a lane in front of the mouths, lit shop fronts and street lamps across the lane
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), lam(0x23262d)); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const lane = new THREE.Mesh(new THREE.PlaneGeometry(60, 2.2), bas(0x1b2030)); lane.rotation.x = -Math.PI / 2; lane.position.set(0, 0.004, D / 2 + 1.1); scene.add(lane);
const across = new THREE.Group(); scene.add(across);   // only shown for the inside view, so it never blocks the other cameras
box(60, 1.4, 0.4, lam(0x6a7088), 0, 0.7, D / 2 + 2.5, across);
for (let x = -14; x <= 14; x += 1.0) box(0.5, 0.34, 0.02, bas((Math.round(x) % 3) ? 0xffc27a : 0xbfd6ff), x, 0.62, D / 2 + 2.29, across);
for (let x = -13.5; x <= 14; x += 3.0) { box(0.05, 1.7, 0.05, lam(0x3a3e48), x + 1.45, 0.85, D / 2 + 2.1); const b = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), bas(0xffe2a0)); b.position.set(x + 1.45, 1.72, D / 2 + 2.0); scene.add(b); }

const wallMat = lam(0x7a7f8c), carMat = lam(0x8a8f98), roofMats = [];
const ctx = {
  cutMat(hex) { // a plain lit material, with the game's darker, bluer top faces but without its see-through circle
    const m = new THREE.MeshLambertMaterial({ color: hex }); m.visible = num('roof', 1) !== 0; roofMats.push(m);
    m.onBeforeCompile = sh => {
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vONormal;').replace('#include <project_vertex>', '#include <project_vertex>\nvONormal = normal;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vONormal;').replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\nif ( vONormal.y > 0.5 ) { diffuseColor.rgb = diffuseColor.rgb * 0.42 + vec3( 0.02, 0.022, 0.03 ); }');
    };
    m.customProgramCacheKey = () => 'previewRoof';
    return m;
  },
  makeLabel(text, opts) {
    if (!num('labels', 0)) return new THREE.Sprite();                                         // an empty sprite (the module only asks for one with spec.label)
    const cv = document.createElement('canvas'), c = cv.getContext('2d'); c.font = '700 40px system-ui, sans-serif';
    cv.width = Math.ceil(c.measureText(text).width) + 28; cv.height = 60; c.font = '700 40px system-ui, sans-serif'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(8,12,22,0.78)'; c.fillRect(0, 0, cv.width, cv.height); c.fillStyle = (opts && opts.color) || '#fff'; c.fillText(text, 14, 32);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true })); const h = (opts && opts.h) || 0.4; s.scale.set(h * cv.width / cv.height, h, 1); s.renderOrder = 20; return s;
  },
};

const list = [];
HIDEOUT_KINDS.forEach((kind, i) => {
  const x = (i - (HIDEOUT_KINDS.length - 1) / 2) * GAP;
  const h = buildHideout({ kind, w: W, d: D, seed: SEED + i * 7, label: !!num('labels', 0) }, ctx);   // seeds step by 7, as in the game
  h.g.position.set(x, 0, 0); scene.add(h.g);
  if (kind !== 'grove') {   // three grey walls stand in for the neighbouring buildings (the grove is for the open park)
    box(W + 0.6, WALL_H, 0.3, wallMat, x, WALL_H / 2, -D / 2 - 0.15);
    for (const s of [-1, 1]) box(0.3, WALL_H, D, wallMat, x + s * (W / 2 + 0.15), WALL_H / 2, 0);
  }
  const car = box(0.42, 0.36, 0.86, carMat, x, 0.18, 0); car.visible = num('car', 1) !== 0;
  if (num('jeep', 0)) for (const s of [-1, 1]) { const hl = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), bas(0xfff6dc)); hl.position.set(x + s * 0.15, 0.24, D / 2 + 0.9); scene.add(hl); }
  list.push({ kind, x, h, car });
});

// camera presets
const state = { view: Q.get('view') || 'all', k: num('k', 0), f: Q.has('f') ? num('f', 0) : null, s: Q.has('s') ? num('s', 0) : null, auto: true, time: 0 };
function placeCamera() {
  const it = list[Math.max(0, Math.min(list.length - 1, state.k | 0))], x = it.x, v = state.view;
  const indoors = v === 'inside' || v === 'hide';
  camera.near = indoors ? 0.02 : 0.3; camera.fov = v === 'inside' ? 70 : 52; across.visible = indoors;
  headlamp.position.set(x, 0.7, D / 2 + 0.75); headlamp.target.position.set(x, 0, D / 2 - 5.05);   // a car nosing in at the mouth
  if (v === 'all') { camera.position.set(0, 11.5, 21); camera.lookAt(0, 0.2, 0.4); }
  else if (v.startsWith('trio')) { const cx = (+v.slice(4) - 1) * GAP * 3; camera.position.set(cx, 4.6, 7.4); camera.lookAt(cx, 0.35, 0.2); }
  else if (v === 'chase') { camera.position.set(x, 8.6 * Math.sin(0.84), 0.7 + 8.6 * Math.cos(0.84)); camera.lookAt(x, 0.3, 0.7); }   // the game's chase camera, from the lane side
  else if (v === 'hide') { camera.position.set(x, 0.46, -0.82); camera.lookAt(x, 0.3, 3); }                                        // the game's camera while hidden inside
  else if (v === 'front') { camera.position.set(x + 0.4, 0.75, 3.0); camera.lookAt(x, 0.42, 0.6); }
  else if (v === 'close') { camera.position.set(x + 0.9, 1.9, 3.3); camera.lookAt(x, 0.38, 0.3); }
  else if (v === 'top') { camera.position.set(x, 5.2, 1.6); camera.lookAt(x, 0.2, -0.1); }
  else if (v === 'side') { camera.position.set(x + 2.6, 2.4, 3.2); camera.lookAt(x, 0.35, 0.3); }
  else if (v === 'inside') { camera.position.set(x + num('ix', 0), 0.3, -D / 2 + 0.07); camera.lookAt(x, 0.3, D / 2); }
  camera.updateProjectionMatrix();
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// the demo loop: open, door comes down, police search, door opens again
function demo(t) {
  const c = t % 9;
  const f = c < 2 ? 0 : c < 2.5 ? (c - 2) / 0.5 : c < 8 ? 1 : c < 8.5 ? 1 - (c - 8) / 0.5 : 0;
  const s = c > 3.2 && c < 7.4 ? Math.max(0, Math.sin((c - 3.2) / 4.2 * Math.PI)) : 0;
  return { f, s };
}
function frame(dt, time) {
  const d = demo(time), f = state.f == null ? d.f : state.f, s = state.s == null ? d.s : state.s;
  for (const it of list) { it.h.setClosed(f); it.h.setSearch(s); it.h.update(dt, time); }
  placeCamera();
  renderer.render(scene, camera);
  hud.innerHTML = list.map((it, i) => `${i === (state.k | 0) ? '<b>' : ''}${i} ${it.kind}: ${it.h.name}${i === (state.k | 0) ? '</b>' : ''}`).join(' &nbsp;|&nbsp; ') + `<br>view=${state.view}  closed=${f.toFixed(2)}  search=${s.toFixed(2)}  draw calls=${renderer.info.render.calls}  triangles=${renderer.info.render.triangles}<br><span id="map">${kindTable}</span>`;
}
const hud = document.getElementById('hud'), bar = document.getElementById('bar');
// kindFor(): every hiding-spot kind used in data/map.json, plus an unknown one
const kindTable = 'kindFor: ' + ['rooftop water tank', 'sack stack', 'covered handcart', 'basket stack', 'drain niche', 'bush or hedge', 'parked bus', 'upturned boat', 'scrap heap', 'something else'].map(k => `${k} &rarr; ${kindFor(k)}`).join(', ');
for (const v of ['all', 'trio0', 'trio1', 'trio2', 'chase', 'hide', 'close', 'front', 'side', 'top', 'inside']) { const b = document.createElement('button'); b.textContent = v; b.onclick = () => { state.view = v; }; bar.appendChild(b); }
{ const b = document.createElement('button'); b.textContent = 'next kind'; b.onclick = () => { state.k = ((state.k | 0) + 1) % list.length; }; bar.appendChild(b); }
{ const b = document.createElement('button'); b.textContent = 'roofs'; b.onclick = () => { for (const m of roofMats) m.visible = !m.visible; }; bar.appendChild(b); }

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (!state.auto) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now; state.time += dt;
  frame(dt, state.time);
}
requestAnimationFrame(loop);

// hooks for the Playwright check
window.__pv = {
  state, list, kinds: HIDEOUT_KINDS, kindFor, renderer,
  shot(o) { state.auto = false; Object.assign(state, o || {}); const t = o && o.time != null ? o.time : state.time; for (let i = 0; i < 3; i++) frame(0.05, t + i * 0.05); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; },
  roofs(on) { for (const m of roofMats) m.visible = !!on; },
  cars(on) { for (const it of list) it.car.visible = !!on; },
  disposeAll() { for (const it of list) it.h.dispose(); return { geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures }; },
  ready: true,
};
</script>
</body>
</html>
