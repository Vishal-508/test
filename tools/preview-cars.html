<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cars.js preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; color: #cfd6e4; font: 12px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 10px; top: 8px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #hud button { pointer-events: auto; background: #151b2a; color: #cfd6e4; border: 1px solid #2c3650; border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer; }
  #hud button.on { background: #2a3a66; border-color: #5a78c8; }
  #info { margin-left: auto; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .tag { position: fixed; transform: translate(-50%, 0); white-space: nowrap; text-align: center; font-size: 10.5px; color: #aeb8cc; text-shadow: 0 1px 2px #000; pointer-events: none; }
  .tag b { display: block; color: #e8ecf5; font-weight: 600; font-size: 11.5px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="views"></span><button id="bloomBtn">post</button><button id="pauseBtn">pause</button><span id="info"></span></div>
<script type="module">
// Preview for js/cars.js: every getaway paint in a row plus two police jeeps, lit the way js/game.js lights the town
// (same hemisphere and moon lights, the player's headlamp spotlight on the first car, the red/blue siren point lights
// on the wailing jeep, and the game's own post-processing from js/postfx.js when it can be loaded).
// Drag to orbit, wheel to zoom.
// URL options: ?view=chase|close|rear|side|top|one|jeep|jeepR|front|hero|ghost  &post=0  &dim=0.6  &t=1.25 (freeze time)  &tags=0  &lamps=0
//              &cam=px,py,pz,tx,ty,tz (camera position and target; add &car=3 to make them relative to car 3 in the row)
//              e.g. ?car=0&cam=0,6.4,-5.74,0,0,0.6 is the game's chase camera (8.6 units away, 48 degrees up) behind the first car
import * as THREE from '../vendor/three.module.min.js';
import { PAINTS, makeCar } from '../js/cars.js';

const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.info.autoReset = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f1d);
scene.fog = new THREE.Fog(0x0a0f1d, 16, 52);
const camera = new THREE.PerspectiveCamera(52, 1, 0.3, 180);
const dim = Q.has('dim') ? +Q.get('dim') : 1, gameLamps = Q.get('lamps') !== '0';
scene.add(new THREE.HemisphereLight(0x8d93ab, 0x4c4850, 1.55 * dim));
const moon = new THREE.DirectionalLight(0xc6ceff, 1.05 * dim); moon.position.set(-30, 40, 45); scene.add(moon);
const headlamp = new THREE.SpotLight(0xfff1d0, gameLamps ? 16 : 0, 13, 0.56, 0.85, 1.0); scene.add(headlamp); scene.add(headlamp.target);
const sirenRed = new THREE.PointLight(0xff2a2a, 0, 9, 1.4), sirenBlue = new THREE.PointLight(0x2a5cff, 0, 9, 1.4); scene.add(sirenRed); scene.add(sirenBlue);

// dark road-coloured ground with a little grain and lane dashes, lifted like the game's tarmac
const gc = document.createElement('canvas'); gc.width = gc.height = 256;
const g2 = gc.getContext('2d'); g2.fillStyle = '#262b36'; g2.fillRect(0, 0, 256, 256);
for (let k = 0; k < 2600; k++) { const v = 26 + Math.random() * 30 | 0; g2.fillStyle = `rgba(${v},${v + 3},${v + 10},0.5)`; g2.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
g2.fillStyle = '#6a6a62'; g2.fillRect(124, 20, 8, 90);
const gt = new THREE.CanvasTexture(gc); gt.colorSpace = THREE.SRGBColorSpace; gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(30, 30); gt.anisotropy = 4;
const gmat = new THREE.MeshStandardMaterial({ map: gt, roughness: 0.9, metalness: 0 }); gmat.color.setRGB(1.62, 1.55, 1.48);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), gmat);
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// the line-up. A camera behind the cars looks along +Z, where screen-right is -X, so the first car goes at +X.
const STEP = 0.98, X0 = 4.5 * STEP;
const base = { speed: 0, steer: 0, brake: false, lights: true, siren: false, nitro: false, hidden: false, alpha: 1 };
const plan = [
  { what: 'driving, steering', set: (s, t) => { s.speed = 2.2 + Math.sin(t * 1.3) * 1.2; s.steer = Math.sin(t * 1.1); } },
  { what: 'braking', set: s => { s.speed = 1.2; s.brake = true; } },
  { what: 'reversing', set: (s, t) => { s.speed = -0.8; s.steer = Math.sin(t * 0.9) * 0.6; } },
  { what: 'nitro', set: s => { s.speed = 4.5; s.nitro = true; } },
  { what: 'lights off', set: s => { s.speed = 1.5; s.lights = false; } },
  { what: 'hidden', set: s => { s.hidden = true; } },
  { what: 'ghost 0.4', set: s => { s.steer = 0.4; s.hidden = true; s.alpha = 0.4; } },
  { what: 'steer right', set: (s, t) => { s.speed = 2.5; s.steer = 1; s.brake = Math.sin(t * 3) > 0.3; } },
  { what: 'siren on', kind: 'police', set: (s, t) => { s.speed = 3 + Math.sin(t * 1.3); s.steer = Math.sin(t * 0.8) * 0.7; s.siren = true; } },
  { what: 'siren off', kind: 'police', set: (s, t) => { s.speed = 2; s.nitro = Math.sin(t * 1.5) > 0; } },
];
const cars = plan.map((p, i) => {
  const car = makeCar(p.kind || 'chor', { paint: PAINTS[i % PAINTS.length].hex });
  car.g.position.set(X0 - i * STEP, 0, 0);
  scene.add(car.g);
  const tag = document.createElement('div'); tag.className = 'tag';
  tag.innerHTML = `<b>${p.kind === 'police' ? 'Police' : PAINTS[i].name}</b>${p.what}`;
  document.body.appendChild(tag);
  return { car, p, tag, state: Object.assign({}, base) };
});
const xOf = i => X0 - i * STEP;
headlamp.position.set(xOf(0), 0.7, 0.2); headlamp.target.position.set(xOf(0), 0, 6);
sirenRed.position.set(xOf(8), 0.8, 0); sirenBlue.position.set(xOf(8), 0.8, 0);

// views
const VIEWS = {
  chase: { pos: [0, 6.9, -5.8], at: [0, 0, 0.55] },
  close: { pos: [xOf(7.5) - 0.2, 0.62, 1.75], at: [xOf(7.5), 0.14, 0] },
  rear: { pos: [xOf(2) + 0.5, 0.95, -1.9], at: [xOf(2), 0.1, -0.15] },
  side: { pos: [xOf(0) + 1.7, 0.33, 0.25], at: [xOf(0.5), 0.14, 0] },
  top: { pos: [0, 9.5, 0.01], at: [0, 0, 0.9] },
  one: { pos: [xOf(8), 7 * Math.sin(0.87), -7 * Math.cos(0.87)], at: [xOf(8), 0.2, 0.3] },
  jeep: { pos: [xOf(8.5) + 1.3, 0.75, -1.5], at: [xOf(8.5), 0.18, 0] },
  front: { pos: [xOf(3.5), 0.5, 2.6], at: [xOf(3.5), 0.14, 0] },
  hero: { pos: [xOf(0) - 0.9, 0.55, -1.25], at: [xOf(0), 0.13, 0] },
  ghost: { pos: [xOf(5.5) + 0.2, 0.7, -1.7], at: [xOf(5.5), 0.13, 0] },
  jeepR: { pos: [xOf(8.5) - 1.7, 0.6, 0.9], at: [xOf(8.5), 0.18, 0] },
};
const target = new THREE.Vector3(), orbit = { r: 9, th: 0, ph: 0.9 };
function setView(name) {
  const v = VIEWS[name] || VIEWS.chase;
  target.fromArray(v.at);
  const d = new THREE.Vector3().fromArray(v.pos).sub(target);
  orbit.r = d.length(); orbit.th = Math.atan2(d.x, d.z); orbit.ph = Math.asin(d.y / orbit.r);
  for (const b of document.querySelectorAll('#views button')) b.classList.toggle('on', b.textContent === name);
}
function placeCamera() {
  const c = Math.cos(orbit.ph);
  camera.position.set(target.x + orbit.r * c * Math.sin(orbit.th), target.y + orbit.r * Math.sin(orbit.ph), target.z + orbit.r * c * Math.cos(orbit.th));
  camera.lookAt(target);
}
for (const name of Object.keys(VIEWS)) {
  const b = document.createElement('button'); b.textContent = name; b.onclick = () => setView(name);
  document.getElementById('views').appendChild(b);
}
// ?cam=px,py,pz,tx,ty,tz puts the camera anywhere; ?car=3&cam=... gives the numbers relative to car 3 in the row
if (Q.has('cam')) {
  const n = Q.get('cam').split(',').map(Number), ox = Q.has('car') ? xOf(+Q.get('car')) : 0;
  if (n.length === 6 && n.every(Number.isFinite)) VIEWS.custom = { pos: [n[0] + ox, n[1], n[2]], at: [n[3] + ox, n[4], n[5]] };
}
setView(VIEWS.custom ? 'custom' : Q.get('view') || 'chase');
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  orbit.th -= (e.clientX - drag[0]) * 0.006; orbit.ph = Math.max(0.02, Math.min(1.55, orbit.ph + (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY];
});
canvas.addEventListener('wheel', e => { orbit.r = Math.max(0.6, Math.min(40, orbit.r * (e.deltaY > 0 ? 1.1 : 0.9))); e.preventDefault(); }, { passive: false });

// post-processing: the game's own chain if js/postfx.js loads, else the same bloom numbers by hand, else none
let post = null, postName = 'none', postOn = Q.get('post') !== '0';
try {
  const m = await import('../js/postfx.js');
  post = m.makePost(renderer, scene, camera); post.setEnabled(true);
  if (!post.enabled) throw new Error('postfx.js could not start');
  postName = 'js/postfx.js';
} catch (err) {
  post = null;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.5;
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('../vendor/addons/postprocessing/EffectComposer.js'), import('../vendor/addons/postprocessing/RenderPass.js'),
      import('../vendor/addons/postprocessing/UnrealBloomPass.js'), import('../vendor/addons/postprocessing/OutputPass.js')]);
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(512, 320), 0.5, 0.5, 0.9));
    composer.addPass(new OutputPass());
    post = { render: () => composer.render(), setSize: (w, h) => composer.setSize(w, h) };
    postName = 'stand-in bloom';
  } catch (err2) { console.warn('no post-processing available, drawing plain'); }
}
const postBtn = document.getElementById('bloomBtn'), pauseBtn = document.getElementById('pauseBtn');
postBtn.onclick = () => { postOn = !postOn; };
let paused = false; pauseBtn.onclick = () => { paused = !paused; };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (post) post.setSize(w, h);
}
addEventListener('resize', resize); resize();

const frozen = Q.has('t') ? +Q.get('t') : null, showTags = Q.get('tags') !== '0';
const info = document.getElementById('info'), v3 = new THREE.Vector3();
let last = performance.now(), time = 0, frames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) time += dt;
  const t = frozen == null ? time : frozen;
  for (const c of cars) { Object.assign(c.state, base); c.p.set(c.state, t); c.car.update(c.state, paused ? 0 : dt, t); }
  // the game's siren lights: red on odd sixths of a second, blue on even ones
  const ph = Math.floor(t * 6) % 2;
  sirenRed.intensity = gameLamps && ph ? 16 : 0; sirenBlue.intensity = gameLamps && !ph ? 16 : 0;
  placeCamera();
  renderer.info.reset();
  if (post && postOn) post.render(dt); else renderer.render(scene, camera);
  postBtn.classList.toggle('on', !!post && postOn); pauseBtn.classList.toggle('on', paused);
  for (const c of cars) {
    v3.set(c.car.g.position.x, 0, -0.75).project(camera);
    const vis = showTags && v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05;
    c.tag.style.display = vis ? '' : 'none';
    if (vis) { c.tag.style.left = (v3.x * 0.5 + 0.5) * innerWidth + 'px'; c.tag.style.top = (-v3.y * 0.5 + 0.5) * innerHeight + 'px'; }
  }
  if (++frames % 20 === 0) info.textContent = `post: ${post && postOn ? postName : 'off'} | ${renderer.info.render.calls} draw calls, ${renderer.info.render.triangles} triangles, ${(dt * 1000).toFixed(0)} ms`;
  window.__frames = frames;
}
requestAnimationFrame(frame);

// hooks for the automated check
window.__view = setView;
window.__stats = () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, programs: renderer.info.programs.length, post: post && postOn ? postName : 'off' });
window.__test = () => {
  // build, animate through every state, ghost and un-ghost, then dispose: memory must come back to where it was
  const before = { geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures };
  const a = makeCar('chor', { paint: 0x884422 }), b = makeCar('police');
  a.g.position.set(0, 0, 3); b.g.position.set(1, 0, 3); scene.add(a.g, b.g);
  for (let i = 0; i < 40; i++) {
    const s = { speed: (i - 12) * 0.3, steer: Math.sin(i), brake: i % 2 === 0, lights: i % 3 !== 0, siren: i % 4 < 2, nitro: i % 5 === 0, hidden: i > 34, alpha: i % 7 === 3 ? 0.3 : 1 };
    a.update(s, 0.016, i * 0.016); b.update(s, 0.016, i * 0.016);
    if (i % 8 === 0) renderer.render(scene, camera);
  }
  a.update(undefined, 0, 0); b.update({}, -1, NaN); a.setPaint(0x224488);
  renderer.render(scene, camera);
  const during = { geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures };
  a.dispose(); b.dispose();
  renderer.render(scene, camera);
  const after = { geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures };
  return { before, during, after, detached: !a.g.parent && !b.g.parent };
};
// size of the solid parts of a fresh car (no ground effects), to check the collision footprint
window.__measure = kind => {
  const car = makeCar(kind, {}), box = new THREE.Box3(), one = new THREE.Box3();
  car.update({ speed: 0, steer: 0 }, 0.016, 0); car.g.updateMatrixWorld(true);
  car.g.traverse(o => { if (o.isMesh && o.renderOrder >= 0 && o.material.blending !== THREE.AdditiveBlending) { one.setFromObject(o); box.union(one); } });
  car.dispose();
  const r = v => +v.toFixed(4);
  return { min: box.min.toArray().map(r), max: box.max.toArray().map(r), size: box.getSize(new THREE.Vector3()).toArray().map(r) };
};
window.__cars = cars; window.__ready = true;
</script>
</body>
</html>
